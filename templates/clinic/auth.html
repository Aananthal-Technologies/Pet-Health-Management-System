<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHMS — Clinic Portal</title>
  <link rel="stylesheet" href="/css/clinic.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" tabindex="0" onclick="switchTab('login')" onkeydown="if(event.key==='Enter'||event.key===' ')switchTab('login')">Login</div>
      <div class="auth-tab" tabindex="0" onclick="switchTab('register')" onkeydown="if(event.key==='Enter'||event.key===' ')switchTab('register')">Register Clinic</div>
    </div>

    <!-- LOGIN -->
    <div class="auth-form active" id="login">
      <h2>Clinic Login</h2>
      <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="clinic@email.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••" /></div>
      <p class="msg" id="l-msg"></p>
      <button type="submit" onclick="login()">Login</button>
    </div>

    <!-- REGISTER -->
    <div class="auth-form" id="register">
      <h2>Register Your Clinic</h2>
      <fieldset>
        <legend>Clinic Info</legend>
        <div class="field"><label>Clinic Name *</label><input type="text" id="r-name" placeholder="Happy Paws Vet" /></div>
        <div class="row">
          <div class="field"><label>Email *</label><input type="email" id="r-email" placeholder="clinic@email.com" /></div>
          <div class="field"><label>Phone *</label><input type="tel" id="r-phone" placeholder="+91 9999999999" /></div>
        </div>
        <div class="field"><label>Password *</label><input type="password" id="r-pass" placeholder="Min 6 characters" /></div>
        <div class="field"><label>Confirm Password *</label><input type="password" id="r-pass-confirm" placeholder="Repeat password" /></div>
        <div class="row">
          <div class="field"><label>Pincode *</label><input type="text" id="r-pincode" placeholder="560045" maxlength="6" /></div>
          <div class="field"><label>License No.</label><input type="text" id="r-license" placeholder="VET/2024/001" /></div>
        </div>
        <div class="field"><label>Address *</label><input type="text" id="r-address" placeholder="Street, City" /></div>
      </fieldset>

      <fieldset>
        <legend>Services</legend>
        <div class="row">
          <div class="field"><label>Specialization</label>
            <select id="r-spec">
              <option value="">All Animals</option>
              <option>Dogs</option><option>Cats</option><option>Birds</option>
              <option>Exotic Animals</option><option>Small Animals</option><option>Livestock</option>
            </select>
          </div>
          <div class="field"><label>Working Hours</label><input type="text" id="r-hours" placeholder="9AM – 6PM" /></div>
        </div>
        <div class="field"><label>Description</label><textarea id="r-desc" rows="2" placeholder="About your clinic..."></textarea></div>
      </fieldset>

      <p class="msg" id="r-msg"></p>
      <button type="submit" onclick="register()">Register Clinic</button>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('clinicToken')) location.href = '/dashboard';

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (tab === 'login') ? i === 0 : i === 1));
    document.getElementById('login').classList.toggle('active', tab === 'login');
    document.getElementById('register').classList.toggle('active', tab === 'register');
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text; el.className = 'msg ' + type;
  }

  function storeAndRedirect(data) {
    localStorage.setItem('clinicToken',   data.token);
    localStorage.setItem('clinicName',    data.name);
    localStorage.setItem('clinicPincode', data.pincode);
    localStorage.setItem('clinicId',      data.clinicId);
    location.href = '/dashboard';
  }

  async function login() {
    const email    = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-pass').value;
    if (!email || !password) return showMsg('l-msg', 'Please fill all fields', 'error');
    try {
      const res = await fetch('/api/clinic/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      if (!res.ok && res.status !== 401) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (!data.success) return showMsg('l-msg', data.message, 'error');
      storeAndRedirect(data);
    } catch (err) { showMsg('l-msg', err.message || 'Network error', 'error'); }
  }

  async function register() {
    const name    = document.getElementById('r-name').value.trim();
    const email   = document.getElementById('r-email').value.trim();
    const phone   = document.getElementById('r-phone').value.trim();
    const password        = document.getElementById('r-pass').value;
    const passwordConfirm = document.getElementById('r-pass-confirm').value;
    const pincode = document.getElementById('r-pincode').value.trim();
    const address = document.getElementById('r-address').value.trim();
    if (!name || !email || !phone || !password || !pincode || !address)
      return showMsg('r-msg', 'Please fill all required fields', 'error');
    if (password.length < 6) return showMsg('r-msg', 'Password must be at least 6 characters', 'error');
    if (password !== passwordConfirm) return showMsg('r-msg', 'Passwords do not match', 'error');
    try {
      const body = {
        name, email, password, phone, pincode, address,
        licenseNumber:  document.getElementById('r-license').value.trim() || null,
        specialization: document.getElementById('r-spec').value           || null,
        workingHours:   document.getElementById('r-hours').value.trim()   || null,
        description:    document.getElementById('r-desc').value.trim()    || null,
      };
      const res  = await fetch('/api/clinic/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok && res.status !== 400) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (!data.success) return showMsg('r-msg', data.message, 'error');
      storeAndRedirect(data);
    } catch (err) { showMsg('r-msg', err.message || 'Network error', 'error'); }
  }
</script>
</body>
</html>
