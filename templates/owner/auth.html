<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHMS — Pet Owner</title>
  <link rel="stylesheet" href="/css/owner.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">Login</div>
      <div class="auth-tab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- LOGIN -->
    <div class="auth-form active" id="login">
      <h2>Welcome back</h2>
      <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="you@email.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••" /></div>
      <p class="msg" id="l-msg"></p>
      <button type="submit" onclick="login()">Login</button>
    </div>

    <!-- REGISTER -->
    <div class="auth-form" id="register">
      <h2>Create account</h2>
      <fieldset>
        <legend>Your Details</legend>
        <div class="row">
          <div class="field"><label>Full Name *</label><input type="text" id="r-name" placeholder="John Doe" /></div>
          <div class="field"><label>Age *</label><input type="number" id="r-age" placeholder="25" min="1" max="120" /></div>
        </div>
        <div class="field"><label>Email *</label><input type="email" id="r-email" placeholder="you@email.com" /></div>
        <div class="field"><label>Password *</label><input type="password" id="r-pass" placeholder="Min 6 characters" /></div>
        <div class="row">
          <div class="field"><label>Phone</label><input type="tel" id="r-phone" placeholder="+91 9999999999" /></div>
          <div class="field"><label>Pincode *</label><input type="text" id="r-pincode" placeholder="560045" maxlength="6" /></div>
        </div>
        <div class="field"><label>Address</label><input type="text" id="r-address" placeholder="Street, City" /></div>
      </fieldset>

      <fieldset>
        <legend>Your First Pet (optional)</legend>
        <div class="row">
          <div class="field"><label>Pet Name</label><input type="text" id="p-name" placeholder="Buddy" /></div>
          <div class="field"><label>Species</label>
            <select id="p-species">
              <option value="">Select</option>
              <option>dog</option><option>cat</option><option>bird</option>
              <option>rabbit</option><option>fish</option><option>reptile</option><option>other</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Breed</label><input type="text" id="p-breed" placeholder="Labrador" /></div>
          <div class="field"><label>Gender</label>
            <select id="p-gender"><option value="">Select</option><option>male</option><option>female</option><option>unknown</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Age (yrs)</label><input type="number" id="p-age" placeholder="3" min="0" /></div>
          <div class="field"><label>Weight (kg)</label><input type="number" id="p-weight" placeholder="12.5" step="0.1" min="0" /></div>
        </div>
        <div class="row">
          <div class="field"><label>Color</label><input type="text" id="p-color" placeholder="Golden" /></div>
          <div class="field"><label>Vaccination</label>
            <select id="p-vacc">
              <option value="unknown">Unknown</option>
              <option value="vaccinated">Vaccinated</option>
              <option value="not vaccinated">Not Vaccinated</option>
              <option value="partial">Partially Vaccinated</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Last Checkup Date</label><input type="date" id="p-checkup" /></div>
        <div class="field"><label>Medical Notes</label><textarea id="p-notes" rows="2" placeholder="Any conditions, allergies..."></textarea></div>
      </fieldset>

      <p class="msg" id="r-msg"></p>
      <button type="submit" onclick="register()">Create Account</button>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('ownerToken')) location.href = '/dashboard';

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (tab === 'login') ? i === 0 : i === 1));
    document.getElementById('login').classList.toggle('active', tab === 'login');
    document.getElementById('register').classList.toggle('active', tab === 'register');
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function login() {
    const email    = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-pass').value;
    if (!email || !password) return showMsg('l-msg', 'Please fill all fields', 'error');
    try {
      const res = await fetch('/api/owner/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
      if (!res.ok && res.status !== 401) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (!data.success) return showMsg('l-msg', data.message, 'error');
      localStorage.setItem('ownerToken',   data.token);
      localStorage.setItem('ownerName',    data.name);
      localStorage.setItem('ownerPincode', data.pincode);
      localStorage.setItem('ownerId',      data.userId);
      location.href = '/dashboard';
    } catch (err) { showMsg('l-msg', err.message || 'Something went wrong', 'error'); }
  }

  async function register() {
    const name     = document.getElementById('r-name').value.trim();
    const age      = document.getElementById('r-age').value;
    const email    = document.getElementById('r-email').value.trim();
    const password = document.getElementById('r-pass').value;
    const phone    = document.getElementById('r-phone').value.trim();
    const pincode  = document.getElementById('r-pincode').value.trim();
    const address  = document.getElementById('r-address').value.trim();

    if (!name || !age || !email || !password || !pincode) return showMsg('r-msg', 'Please fill required fields', 'error');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('r-msg', 'Invalid email format', 'error');
    if (password.length < 6) return showMsg('r-msg', 'Password must be at least 6 characters', 'error');
    if (!/^\d{6}$/.test(pincode)) return showMsg('r-msg', 'Pincode must be 6 digits', 'error');

    const petName = document.getElementById('p-name').value.trim();
    const pet = petName ? {
      name:               petName,
      species:            document.getElementById('p-species').value,
      breed:              document.getElementById('p-breed').value.trim()  || null,
      gender:             document.getElementById('p-gender').value        || null,
      age:                (v => v !== '' ? Number(v) : null)(document.getElementById('p-age').value),
      weight:             (v => v !== '' ? Number(v) : null)(document.getElementById('p-weight').value),
      color:              document.getElementById('p-color').value.trim()  || null,
      vaccination_status: document.getElementById('p-vacc').value,
      last_checkup_date:  document.getElementById('p-checkup').value      || null,
      medical_notes:      document.getElementById('p-notes').value.trim() || null,
    } : null;

    try {
      const res = await fetch('/api/owner/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, phone, age: Number(age), address, pincode, pet }),
      });
      if (!res.ok && res.status !== 400) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (!data.success) return showMsg('r-msg', data.message, 'error');
      localStorage.setItem('ownerToken',   data.token);
      localStorage.setItem('ownerName',    data.name);
      localStorage.setItem('ownerPincode', data.pincode);
      localStorage.setItem('ownerId',      data.userId);
      location.href = '/dashboard';
    } catch (err) { showMsg('r-msg', err.message || 'Something went wrong', 'error'); }
  }
</script>
</body>
</html>
